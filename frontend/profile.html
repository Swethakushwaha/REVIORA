<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>REVIORA - Profile</title>

    <link rel="stylesheet" href="style.css">


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f8fc;

            color: #172033;
        }


        /* =========================
           PAGE
        ========================= */

        .profile-page {
            width: 100%;

            max-width: 1000px;

            margin: 0 auto;

            padding: 30px 20px 60px;
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .profile-back {
            display: inline-flex;

            align-items: center;

            gap: 7px;

            text-decoration: none;

            color: #1769aa;

            font-size: 14px;

            font-weight: 700;

            margin-bottom: 20px;

            transition: 0.2s;
        }


        .profile-back:hover {
            color: #125b91;

            transform: translateX(-2px);
        }


        /* =========================
           MAIN CARD
        ========================= */

        .profile-card {
            position: relative;

            background: #ffffff;

            border-radius: 22px;

            padding: 38px;

            box-shadow:
                0 18px 50px rgba(
                    30,
                    70,
                    100,
                    0.10
                );

            overflow: hidden;
        }


        .profile-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 5px;

            background: #1976b9;
        }


        /* =========================
           HEADER
        ========================= */

        .profile-header {
            margin-bottom: 32px;

            padding-bottom: 24px;

            border-bottom: 1px solid #e7eef4;
        }


        .profile-header h1 {
            margin: 0 0 9px;

            color: #173b5c;

            font-size: 32px;

            letter-spacing: -0.5px;
        }


        .profile-header p {
            margin: 0;

            color: #718398;

            font-size: 15px;

            line-height: 1.6;
        }


        /* =========================
           FORM SECTION
        ========================= */

        .form-section {
            margin-bottom: 32px;
        }


        .form-section-title {
            margin: 0 0 7px;

            color: #173b5c;

            font-size: 19px;

            letter-spacing: -0.2px;
        }


        .form-section-description {
            margin: 0 0 18px;

            color: #718398;

            font-size: 14px;

            line-height: 1.5;
        }


        /* =========================
           INPUT ROWS
        ========================= */

        .form-row {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;

            margin-top: 18px;
        }


        .form-row.three-columns {
            grid-template-columns:
                repeat(3, 1fr);
        }


        .input-group {
            width: 100%;
        }


        .input-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 700;

            color: #334e63;
        }


        .input-group input {
            width: 100%;

            padding: 14px;

            border: 1px solid #d5e2eb;

            border-radius: 11px;

            background: #fbfdff;

            color: #172033;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s,
                background 0.2s;
        }


        .input-group input::placeholder {
            color: #9aabba;
        }


        .input-group input:hover {
            border-color: #bfd2df;
        }


        .input-group input:focus {
            border-color: #5da2cf;

            background: #ffffff;

            box-shadow:
                0 0 0 3px rgba(
                    93,
                    162,
                    207,
                    0.12
                );
        }


        .input-group input[readonly] {
            background: #f3f7fa;

            color: #718398;

            cursor: not-allowed;
        }


        /* =========================
           SUBJECT GRID
        ========================= */

        .subject-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 12px;
        }


        .subject-option {
            display: flex;

            align-items: center;

            gap: 12px;

            min-height: 54px;

            padding: 0 16px;

            background: #f8fbfd;

            border: 1px solid #dfe9f0;

            border-radius: 11px;

            cursor: pointer;

            color: #29445a;

            font-size: 14px;

            font-weight: 600;

            transition:
                background 0.2s,
                border-color 0.2s,
                transform 0.2s,
                box-shadow 0.2s;
        }


        .subject-option:hover {
            background: #eef7fd;

            border-color: #a9cee5;

            transform: translateY(-1px);

            box-shadow:
                0 5px 14px rgba(
                    30,
                    70,
                    100,
                    0.06
                );
        }


        .subject-option:has(
            input[type="checkbox"]:checked
        ) {
            background: #edf7fd;

            border-color: #72afd0;
        }


        .subject-option input[type="checkbox"] {
            width: 18px;

            height: 18px;

            margin: 0;

            flex-shrink: 0;

            cursor: pointer;

            accent-color: #1976b9;
        }


        .subject-option span {
            line-height: 1.3;
        }


        /* =========================
           CUSTOM SUBJECTS
        ========================= */

        .custom-subjects {
            margin-top: 16px;
        }


        .custom-subjects input {
            width: 100%;

            padding: 14px 15px;

            border: 1px solid #d5e2eb;

            border-radius: 11px;

            background: #fbfdff;

            color: #172033;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }


        .custom-subjects input::placeholder {
            color: #9aabba;
        }


        .custom-subjects input:hover {
            border-color: #bfd2df;
        }


        .custom-subjects input:focus {
            border-color: #5da2cf;

            background: #ffffff;

            box-shadow:
                0 0 0 3px rgba(
                    93,
                    162,
                    207,
                    0.12
                );
        }


        .custom-hint {
            margin: 7px 0 0;

            color: #94a3b8;

            font-size: 13px;
        }


        /* =========================
           SAVE BUTTON
        ========================= */

        .save-profile-button {
            width: 100%;

            margin-top: 5px;

            padding: 14px 20px;

            border: none;

            border-radius: 11px;

            background: #1976b9;

            color: #ffffff;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.2s,
                box-shadow 0.2s;
        }


        .save-profile-button:hover {
            background: #125b91;

            transform: translateY(-1px);

            box-shadow:
                0 8px 18px rgba(
                    25,
                    118,
                    185,
                    0.18
                );
        }


        .save-profile-button:active {
            transform: translateY(0);
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 800px) {

            .profile-page {
                padding: 24px 16px 45px;
            }


            .profile-card {
                padding: 30px 24px;

                border-radius: 19px;
            }


            .form-row.three-columns {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 650px) {

            .profile-page {
                padding: 18px 12px 35px;
            }


            .profile-card {
                padding: 25px 18px;

                border-radius: 17px;
            }


            .profile-header {
                margin-bottom: 26px;

                padding-bottom: 20px;
            }


            .profile-header h1 {
                font-size: 27px;
            }


            .profile-header p {
                font-size: 14px;
            }


            .form-row,
            .form-row.three-columns {
                grid-template-columns: 1fr;

                gap: 14px;
            }


            .subject-grid {
                grid-template-columns: 1fr;

                gap: 10px;
            }


            .subject-option {
                min-height: 51px;
            }

        }


        /* =========================
           SMALL MOBILE
        ========================= */

        @media (max-width: 400px) {

            .profile-page {
                padding-left: 9px;

                padding-right: 9px;
            }


            .profile-card {
                padding: 22px 15px;
            }


            .profile-header h1 {
                font-size: 24px;
            }


            .form-section-title {
                font-size: 18px;
            }


            .input-group input,
            .custom-subjects input {
                padding: 13px;
            }


            .save-profile-button {
                padding: 13px;
            }

        }

    </style>

</head>


<body>


    <div class="profile-page">


        <a
            href="index.html"
            class="profile-back"
        >
            ← Dashboard
        </a>


        <section class="profile-card">


            <div class="profile-header">

                <h1>
                    Your Profile 👋
                </h1>

                <p>
                    Tell REVIORA about yourself
                    and choose the subjects you want
                    to track.
                </p>

            </div>


            <form
                id="profileForm"
                class="profile-form"
            >


                <!-- =========================
                     PERSONAL INFORMATION
                ========================= -->

                <div class="form-section">


                    <h2 class="form-section-title">
                        Personal Information
                    </h2>


                    <div class="form-row">


                        <div class="input-group">

                            <label for="name">
                                Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                placeholder="Enter your name"
                            >

                        </div>


                        <div class="input-group">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                placeholder="Your email"
                                readonly
                            >

                        </div>


                    </div>


                </div>


                <!-- =========================
                     ACADEMIC INFORMATION
                ========================= -->

                <div class="form-section">


                    <h2 class="form-section-title">
                        Academic Information
                    </h2>


                    <div class="form-row three-columns">


                        <div class="input-group">

                            <label for="course">
                                Course
                            </label>

                            <input
                                type="text"
                                id="course"
                                placeholder="e.g. BCA"
                            >

                        </div>


                        <div class="input-group">

                            <label for="semester">
                                Semester / Year
                            </label>

                            <input
                                type="text"
                                id="semester"
                                placeholder="e.g. 5th Semester"
                            >

                        </div>


                        <div class="input-group">

                            <label for="college">
                                College
                            </label>

                            <input
                                type="text"
                                id="college"
                                placeholder="College name"
                            >

                        </div>


                    </div>


                </div>


                <!-- =========================
                     SUBJECTS
                ========================= -->

                <div class="form-section">


                    <h2 class="form-section-title">
                        Your Subjects
                    </h2>


                    <p class="form-section-description">
                        Select the subjects you want
                        to track in REVIORA.
                    </p>


                    <div class="subject-grid">


                        <label class="subject-option">

                            <input
                                type="checkbox"
                                value="DBMS"
                            >

                            <span>
                                DBMS
                            </span>

                        </label>


                        <label class="subject-option">

                            <input
                                type="checkbox"
                                value="Software Engineering"
                            >

                            <span>
                                Software Engineering
                            </span>

                        </label>


                        <label class="subject-option">

                            <input
                                type="checkbox"
                                value="Computer Networks"
                            >

                            <span>
                                Computer Networks
                            </span>

                        </label>


                        <label class="subject-option">

                            <input
                                type="checkbox"
                                value="Operating Systems"
                            >

                            <span>
                                Operating Systems
                            </span>

                        </label>


                        <label class="subject-option">

                            <input
                                type="checkbox"
                                value="Data Structures"
                            >

                            <span>
                                Data Structures
                            </span>

                        </label>


                        <label class="subject-option">

                            <input
                                type="checkbox"
                                value="Java"
                            >

                            <span>
                                Java
                            </span>

                        </label>


                        <label class="subject-option">

                            <input
                                type="checkbox"
                                value="Python"
                            >

                            <span>
                                Python
                            </span>

                        </label>


                        <label class="subject-option">

                            <input
                                type="checkbox"
                                value="Web Development"
                            >

                            <span>
                                Web Development
                            </span>

                        </label>


                        <label class="subject-option">

                            <input
                                type="checkbox"
                                value="Cyber Security"
                            >

                            <span>
                                Cyber Security
                            </span>

                        </label>


                        <label class="subject-option">

                            <input
                                type="checkbox"
                                value="Artificial Intelligence"
                            >

                            <span>
                                Artificial Intelligence
                            </span>

                        </label>


                    </div>


                    <div class="custom-subjects">


                        <input
                            type="text"
                            id="customSubjects"
                            placeholder="Add another subject (optional)"
                        >


                        <p class="custom-hint">
                            You can add multiple subjects
                            separated by commas.
                        </p>


                    </div>


                </div>


                <button
                    type="submit"
                    class="save-profile-button"
                >
                    Save Profile
                </button>


            </form>


        </section>


    </div>


    <script>

        /* ==============================
           LOAD EXISTING DATA
        ============================== */

        const student =
            JSON.parse(
                localStorage.getItem("student")
            ) || {};


        const profile =
            JSON.parse(
                localStorage.getItem(
                    "studentProfile"
                )
            ) || {};


        /* ==============================
           FILL EXISTING INFORMATION
        ============================== */

        document.getElementById(
            "name"
        ).value =
            profile.name ||
            student.name ||
            "";


        document.getElementById(
            "email"
        ).value =
            profile.email ||
            student.email ||
            "";


        document.getElementById(
            "course"
        ).value =
            profile.course ||
            "";


        document.getElementById(
            "semester"
        ).value =
            profile.semester ||
            "";


        document.getElementById(
            "college"
        ).value =
            profile.college ||
            "";


        /* ==============================
           RESTORE SELECTED SUBJECTS
        ============================== */

        (profile.subjects || [])
            .forEach(function(subject) {

                document
                    .querySelectorAll(
                        'input[type="checkbox"]'
                    )
                    .forEach(
                        function(checkbox) {

                            if (
                                checkbox.value ===
                                subject
                            ) {

                                checkbox.checked =
                                    true;

                            }

                        }
                    );

            });


        /* ==============================
           SAVE PROFILE
        ============================== */

        document
            .getElementById("profileForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();


                    /* Get selected subjects */

                    let subjects =
                        Array.from(
                            document.querySelectorAll(
                                'input[type="checkbox"]:checked'
                            )
                        ).map(
                            function(checkbox) {

                                return checkbox.value;

                            }
                        );


                    /* Get custom subjects */

                    const custom =
                        document
                            .getElementById(
                                "customSubjects"
                            )
                            .value
                            .split(",")
                            .map(
                                function(subject) {

                                    return subject.trim();

                                }
                            )
                            .filter(Boolean);


                    /* Combine subjects */

                    subjects = [
                        ...new Set([
                            ...subjects,
                            ...custom
                        ])
                    ];


                    /* Create profile */

                    const savedProfile = {

                        name:
                            document
                                .getElementById("name")
                                .value
                                .trim(),

                        email:
                            document
                                .getElementById("email")
                                .value,

                        course:
                            document
                                .getElementById("course")
                                .value
                                .trim(),

                        semester:
                            document
                                .getElementById("semester")
                                .value
                                .trim(),

                        college:
                            document
                                .getElementById("college")
                                .value
                                .trim(),

                        subjects:
                            subjects

                    };


                    /* Save to localStorage */

                    localStorage.setItem(
                        "studentProfile",
                        JSON.stringify(
                            savedProfile
                        )
                    );


                    /* Return to dashboard */

                    window.location.href =
                        "index.html";

                }
            );

    </script>


</body>

</html>
